name: Refresh forecasts and monitor outcomes
on:
  schedule:
    - cron: '17 11,17 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - operations.py
      - extend_data.py
      - etl_contract.py
      - forecast.py
      - workflow.py
      - forecast_weather.py
      - weather_model.py
      - uncertainty.py
      - reports/uncertainty/**
      - .github/workflows/refresh.yml
permissions:
  contents: write
concurrency:
  group: daily-forecast-publication
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-tested.txt
      - uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: raw-v1-${{ runner.os }}-
      - run: python -m unittest discover -s tests -q
      - name: Refresh, check freshness, issue and score
        run: python operations.py
      - name: Preserve input snapshot and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forecast-input-${{ github.run_id }}
          path: |
            data/operational/
            reports/operational/
            data/raw/forecast_weather/
            reports/uncertainty/
          retention-days: 90
          if-no-files-found: warn
      - name: Persist forecast history and run status
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/operational/
          if ! git diff --cached --quiet; then
            git commit -m "Update forecasts and observed performance"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
