name: Refresh forecasts and monitor outcomes
on:
  schedule:
    - cron: '17 11,17 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - operations.py
      - aqi.py
      - aqi_data.py
      - data_sources.py
      - extend_data.py
      - etl_contract.py
      - features.py
      - workflow.py
      - forecast_weather.py
      - weather_model.py
      - uncertainty.py
      - requirements.txt
      - reports/workflow/run.json
      - reports/uncertainty/**
      - .github/workflows/refresh.yml
permissions:
  contents: write
concurrency:
  group: daily-forecast-publication
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - uses: actions/cache@v6
        with:
          path: data/raw
          key: raw-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: raw-v1-${{ runner.os }}-
      - run: python -m unittest discover -s tests -q
      - name: Restore the operational ledger from the data branch
        run: |
          if git ls-remote --exit-code --heads origin data > /dev/null; then
            git fetch --depth=1 origin data
            git checkout FETCH_HEAD -- reports/operational
          fi
      - name: Refresh, check freshness, issue and score
        run: python operations.py
      - name: Preserve input snapshot and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: forecast-input-${{ github.run_id }}
          path: |
            data/operational/
            reports/operational/
            data/raw/forecast_weather/
            reports/uncertainty/
          retention-days: 90
          if-no-files-found: warn
      - name: Publish forecast history and run status to the data branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ledger="$RUNNER_TEMP/ledger"
          if git ls-remote --exit-code --heads origin data > /dev/null; then
            git fetch --depth=1 origin data
            git worktree add --detach "$ledger" FETCH_HEAD
          else
            git worktree add --detach "$ledger"
            git -C "$ledger" checkout --orphan data
            git -C "$ledger" rm -rqf .
          fi
          rm -rf "$ledger/reports/operational"
          mkdir -p "$ledger/reports"
          cp -r reports/operational "$ledger/reports/"
          git -C "$ledger" add -A reports/operational
          if ! git -C "$ledger" diff --cached --quiet; then
            git -C "$ledger" commit -m "Update forecasts and observed performance"
            git -C "$ledger" push origin HEAD:refs/heads/data
          fi
