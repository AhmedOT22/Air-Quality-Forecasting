name: Forecast tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-tested.txt
      - run: python -m unittest discover -s tests -v
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements-tested.txt
            requirements-app.txt
            requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m compileall -q -x 'notebooks/legacy|\.venv' .
      - run: python -m unittest tests.test_dashboard -v
        env:
          AQI_DASHBOARD_OFFLINE: '1'
  notebook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements-tested.txt
            requirements-notebook.txt
      - run: python -m pip install -r requirements-notebook.txt
      - run: python etl_contract.py
      - run: python scripts/execute_notebook.py
